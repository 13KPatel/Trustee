    return{tya:tya,rate:Number(rec.rate)/100,source:'recorded',value:rec.value};
  if(!rec||!(Number(rec.value)>0))return{tya:tya,rate:null,needsValue:true};
  var cum=Number(trust.settlorPriorCLTs||0)+exitChargedBefore(trust,tya);

// Estimate for the NEXT ten-year anniversary, using the trust's current value
function tenYearEstimate(trust){

  if(!trust.established)return null;
  var i=lastAnniversaryIndex(trust,tdy())+1,tya=anniversaryDate(trust,i);
  var value=Number(trust.currentValue||trust.initialValue||0);
  var prior=Number(trust.settlorPriorCLTs||0),charged=exitChargedBefore(trust,tya),cum=prior+charged;

    bound:ihtBound(trust,'ten'),needsReturn:value>NRB*0.8};

// Exit charge on capital leaving the trust. paidBy: 'trust' grosses up (IHTM42118).
function calcExitCharge(trust,amount,dateStr,paidBy,internal){
  amount=Number(amount)||0;

  if(ap===null)return{unknown:true,charged:false};
  if(!trust.established||!dateStr||dateStr<trust.established)return null;
  if(trust.type==='Will Trust'&&dateStr<=isoD(addMonthsD(parseD(trust.established),24)))
    return{tax:0,rate:0,charged:false,s144:true,
      note:'Paid within 2 years of the death, so it\'s treated as made by the will itself: no exit charge.'};

    note:i===0?'Paid within the first 3 months of the trust: no exit charge.':'Paid within 3 months after a 10-year anniversary: no exit charge.'};

// Turn a result into what the trustee sees

// ============================================================
// COMPLIANCE CALENDAR  (checked October 2026)
// SA900: paper by 31 Oct, online return and tax by 31 Jan after the tax year (GOV.UK
//   "Trustees: tax responsibilities"). Payments on account 31 Jan and 31 Jul when the
//   previous year's bill was over £1,000 (TMA 1970 s.59A) - shown as "if HMRC requires one".
// IHT: IHT100 and payment within 6 months after the end of the month of a 10-year
//   anniversary or exit charge (IHTA 1984 s.216(6)(ad), IHTM10836; GOV.UK "Pay IHT: trusts").
// TRS: changes within 90 days; taxable trusts confirm the register by 31 Jan after each
//   tax year with a liability; registration within 90 days (TRSM40010).
// R185: no fixed deadline; must be given if the beneficiary asks in writing (ITA 2007 s.975).
// Dates are worked out in UTC so they never shift by a day in UK summer time.
// ============================================================
function endOfMonthPlus(dateStr,months){var d=parseD(dateStr);return isoD(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+months+1,0)));}

function complianceDates(t,today){
  var kd=[],cur=taxYearOf(today),tt=t.type||'Discretionary';
  function add(date,label,type){if(date&&date<today)return;kd.push({date:date,label:label,du:date?dbt(today,date):null,type:type});}
  // Self Assessment: not for bare trusts (the beneficiary's own return) or charities

    // One item for the tax year that has ended: dated 31 Oct until it passes, then 31 Jan.
    // The current year's return is not shown until that year ends.
    // Needed if HMRC sent a notice to file, or if there was tax to pay (then HMRC must be told by 5 October).
    // Income within the de minimis with no gains needs no return (F(No.2)A 2023 Sch 2).
    var ry=cur-1,paper=(ry+1)+'-10-31',online=(ry+2)+'-01-31',rs=returnStatus(t,ry);
    if(rs.notice==='yes'||rs.taxable)add(today<=paper?paper:online,'Tax return (SA900) for '+shortYear(ry)+': by '+fdU(paper)+' on paper or '+fdU(online)+' online; any tax due '+fdU(online),'tax');
    if(rs.taxable&&rs.notice==='no'){
      var nd=(ry+1)+'-10-05',nl='Tell HMRC the trust has '+rs.why.join(' and ')+' to pay for '+shortYear(ry)+', as it has not been sent a tax return';
      if(nd<today)kd.push({date:null,label:nl+' (overdue: was due '+fdU(nd)+')',du:-1,type:'tax',overdue:true});
      else add(nd,nl+', by '+fdU(nd),'tax');
    }
    if(rs.taxable&&rs.notice==='unsure')kd.push({date:null,label:'Does HMRC send this trust a tax return each year? Answer in the trust settings: if not, you must tell HMRC about the tax to pay',du:null,type:'tax'});
    if(!rs.taxable&&rs.notice!=='yes')kd.push({date:null,label:'No tax return needed for '+shortYear(ry)+': '+(rs.income>0?'income was within the '+fm(rs.limit)+' tax-free amount':'no income')+' and no taxable gains. If HMRC sends a notice to file, you must still file'+(t.settlorInterested?'. The settlor must still include the trust\'s income on their own tax return':''),du:null,type:'tax'});
    var prev=trustIncomeTax(t,cur-1);
    if(prev&&prev.tax>1000){
      add((cur+1)+'-01-31','1st payment on account for '+shortYear(cur)+' (an advance towards that year\'s tax), if HMRC asks for one','tax');
      add((cur+1)+'-07-31','2nd payment on account for '+shortYear(cur)+' (an advance towards that year\'s tax), if HMRC asks for one','tax');
    }
  }

  if(t.established&&rpApplies(t)===true){

    var tyaDue=endOfMonthPlus(tya,6);
    add(tyaDue,(i*10)+'-year charge on '+fdU(tya)+': IHT100 and tax due by '+fdU(tyaDue),'iht');
    if(i>1){var pa=anniversaryDate(t,i-1),pd=endOfMonthPlus(pa,6);add(pd,((i-1)*10)+'-year charge on '+fdU(pa)+': IHT100 and tax due by '+fdU(pd),'iht');}

      var ec=calcExitCharge(t,d.amount,d.date,d.ihtPaidBy);

      else add(due,'IHT100 for the capital payment of '+fm(d.amount)+' paid '+fd(d.date)+' (may not be needed if the trust is an excepted settlement)','iht');
    });
  }

// Push everything still pending (uses the current in-memory S).
async function flushPending(){
  var dels=listGet(DEL_KEY);
  for(var i=0;i<dels.length;i++){
    try{await deleteTrustFromCloud(dels[i]);listRemove(DEL_KEY,dels[i]);}catch(e){console.warn('Retry delete failed:',e);}
  }
  var dirty=listGet(DIRTY_KEY);
  for(var j=0;j<dirty.length;j++){
    var id=dirty[j];
    if(!S.trusts.find(function(t){return t.id===id})){listRemove(DIRTY_KEY,id);continue;}
    try{await saveTrustToCloud(id);listRemove(DIRTY_KEY,id);}catch(e){console.warn('Retry save failed:',e);}
  }

async function loadFromCloud(){

  if(local&&owner&&owner!==uid){

  } else if(local&&!owner){
    // Data created in local mode (before cloud sync): upload it once to this account.
    local.trusts.forEach(function(t){listAdd(DIRTY_KEY,t.id);});
  }

  if(local&&pendingCount()>0){

  }

    var stillDirty=listGet(DIRTY_KEY),pendingDel=listGet(DEL_KEY);
    var merged=emptyState();

function validateRecord(kind,o,trust){
  var e=[],today=tdy(),est=trust&&trust.established;
  function isDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(parseD(s).getTime());}
  function dateRule(label,s,required,notBeforeEst){
    if(!s){if(required)e.push(label+' is required.');return;}
    if(!isDate(s)){e.push(label+' is not a valid date.');return;}
    if(s>today)e.push(label+' can\'t be in the future.');
    if(notBeforeEst&&est&&s<est)e.push(label+' can\'t be before the trust was set up ('+fd(est)+').');
  }
  function money(label,v,opt){
    if(v===''||v===null||v===undefined||isNaN(Number(v))){if(opt.required)e.push(label+' is required.');return;}
    v=Number(v);
    if(opt.positive&&!(v>0))e.push(label+' must be more than \u00A30.');
    if(opt.nonNeg&&v<0)e.push(label+' can\'t be negative.');
    if(opt.nonZero&&v===0)e.push(label+' can\'t be \u00A30.');
    if(Math.abs(v)>1e12)e.push(label+' looks too large.');
  }
  function wholeMin(label,v,min){if(v===''||v===undefined||v===null)return;var n=Number(v);if(!(Number.isInteger(n)&&n>=min))e.push(label+' must be a whole number of at least '+min+'.');}
  if(kind==='trust'){
    if(!o.name)e.push('Trust name is required.');
    if(TT.indexOf(o.type)===-1)e.push('Choose a trust type.');
    dateRule('The date the trust was set up',o.established,true,false);
    money('Initial value',o.initialValue,{nonNeg:true});money('Current value',o.currentValue,{nonNeg:true});
    money('Settlor\'s prior chargeable gifts',o.settlorPriorCLTs,{nonNeg:true});
    wholeMin('The settlor\'s number of trusts',o.settlorTrusts===''?'1':o.settlorTrusts,1);
    wholeMin('Other discretionary trusts',o.otherDiscTrusts,0);
    if(o.trsLastUpdated)dateRule('The date you last updated the TRS',o.trsLastUpdated,false,false);
  } else if(kind==='beneficiary'){
    if(!o.name)e.push('Full name is required.');
    if(o.dob){dateRule('Date of birth',o.dob,false,false);if(isDate(o.dob)&&o.dob<=today&&ageOn(o.dob,today)>120)e.push('Date of birth looks wrong (more than 120 years ago).');}
  } else if(kind==='trustee'){
    if(!o.name)e.push('Full name is required.');
    dateRule('Date appointed',o.appointedDate,false,true);
  } else if(kind==='distribution'){
    var ben=S.beneficiaries.find(function(b){return b.id===o.beneficiaryId});
    if(!o.beneficiaryId)e.push('Choose a beneficiary.');
    else if(!ben||ben.trustId!==o.trustId)e.push('That beneficiary belongs to a different trust.');
    money('Amount',o.amount,{required:true,positive:true});
    dateRule('Date paid',o.date,true,true);
    if(DTP.indexOf(o.distType)===-1)e.push('Choose the type of payment.');
  } else if(kind==='income'){
    money('Amount',o.amount,{required:true,positive:true});dateRule('Date received',o.date,true,true);
  } else if(kind==='expense'){
    money('Amount',o.amount,{required:true,positive:true});dateRule('Date paid',o.date,true,true);
  } else if(kind==='gain'){
    money('Gain or loss',o.amount,{required:true,nonZero:true});dateRule('Completion date',o.date,true,true);
  } else if(kind==='decision'){
    if(!o.title)e.push('Decision title is required.');dateRule('Date',o.date,true,false);
  }
  return e;
}

function cleanImport(inc,keepTrustIds,keepBens){
  var out={},skipped=0,ids={},benTrust={};
  (keepTrustIds||[]).forEach(function(i){ids[i]=true;});
  (keepBens||[]).forEach(function(b){benTrust[b.id]=b.trustId;});
  out.trusts=(Array.isArray(inc.trusts)?inc.trusts:[]).filter(function(t){var g=!!(t&&t.id&&t.name);if(g)ids[t.id]=true;else skipped++;return g;});
  ['beneficiaries','trustees','distributions','decisions','income','expenses','gains'].forEach(function(k){
    out[k]=(Array.isArray(inc[k])?inc[k]:[]).filter(function(x){var g=!!(x&&x.id&&ids[x.trustId]);if(!g)skipped++;return g;});
  });
  out.beneficiaries.forEach(function(b){benTrust[b.id]=b.trustId;});
  out.distributions=out.distributions.filter(function(d){var g=benTrust[d.beneficiaryId]===d.trustId;if(!g)skipped++;return g;});
  return{data:out,skipped:skipped};
}

function mergeImport(incoming){

  var keys=['trusts','beneficiaries','trustees','distributions','decisions','income','expenses','gains'];

function buildGuideResults(){
  var catLabels={'trust-types':'Trust types','tax':'Tax','compliance':'Compliance & reporting','distributions':'Distributions','people':'People'};
  var catOrder=['trust-types','people','tax','distributions','compliance'];
  var q=GQ.toLowerCase().trim();
  var filtered=GD.filter(function(e){
    if(GC!=='all'&&e.cat!==GC)return false;
    if(q){var search=(e.title+' '+e.summary+' '+e.body+' '+(e.example||'')).toLowerCase();return search.indexOf(q)!==-1;}
    return true;
  });
  var out='';
  if(filtered.length===0){
    out='<div class="guide-empty">No entries match "'+esc(GQ)+'".<br>Try a different search term.</div>';
  } else if(q||GC!=='all'){
    filtered.forEach(function(e){out+=guideEntry(e);});
  } else {
    catOrder.forEach(function(cat){
      var items=filtered.filter(function(e){return e.cat===cat});
      if(items.length===0)return;
      out+='<div class="cat-header">'+esc(catLabels[cat]||cat)+'</div>';
      items.forEach(function(e){out+=guideEntry(e);});
    });
  }
  return out;
}

function guideEntry(e){
  var h='<div class="ge"><div class="ge-head" onclick="toggleEntry(\''+e.id+'\')"><div class="ge-cat-dot" style="background:'+e.color+'"></div><div style="flex:1;min-width:0"><div class="ge-title">'+esc(e.title)+'</div><div class="ge-summary">'+esc(e.summary)+'</div></div><div class="ge-chevron" id="ge-chev-'+e.id+'">&#8964;</div></div>';
  h+='<div class="ge-body" id="ge-body-'+e.id+'">'+e.body;
  if(e.example){h+='<div class="ge-example"><div class="ge-example-label">Worked example</div>'+e.example+'</div>';}
  var srcs=GD_SOURCES[e.id]||[];
  if(srcs.length)h+='<div class="ge-sources">Sources: '+srcs.map(function(s){return s[1]?'<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a>':esc(s[0]);}).join(' \u00B7 ')+'</div>';
  h+='</div></div>';
  return h;
}

  var incAll=gin().filter(inYear).sort(byDate);

  var dists=gdi().filter(inYear).sort(byDate);
  var distIncome=dists.filter(function(d){return (d.distType||'').indexOf('Income')===0});
  var distCapital=dists.filter(function(d){return (d.distType||'').indexOf('Income')!==0});

function fAmt(box,part,val,pence){

window.showR185=function(benId,taxYear){

  if(!t||!b)return;
  taxYear=taxYear||((r185Years(benId)[0]||{}).y)||taxYearOf(tdy());
  if(beforeTaxFrom(taxYear)){alert('Trust Manager prepares R185s from the '+shortYear(TAX_FROM)+' tax year. For earlier years, use the R185s issued at the time.');return;}
  var yearStart=new Date(taxYear+'-04-06');
  var yearEnd=new Date((taxYear+1)+'-04-06');

  var dists=gdi().filter(function(d){
    if(d.beneficiaryId!==benId)return false;
    if((d.distType||'').indexOf('Income')===-1)return false;
    var dt=new Date(d.date);return dt>=yearStart&&dt<yearEnd;
  }).sort(function(a,b2){return new Date(a.date)-new Date(b2.date)});

  if(dists.length===0){

  var taxMap=distTaxById(t);

  dists.forEach(function(d){
    var tc=taxMap[d.id]||calcDistTax(d,t);

    }
    if(settlorMinorChildOn(b,d.date)){childExcluded+=amt;return;}    // s.629: taxed on the settlor, R185(Settlor)
    if(isIIP){
      if(tc.deMinimis){bx[6][0]+=amt;untaxedTypes[distLabel(type).replace('Income: ','')]=true;return;} // within the tax free amount: box 6

function poolBalanceAfter(t,y){

  S.distributions.forEach(function(d){if(d.trustId===t.id&&d.date&&taxYearOf(d.date)<=y&&!beforeTaxFrom(taxYearOf(d.date)))out+=(cr[d.id]&&cr[d.id].taxCredit)||0;});
  return inn-out;
}
function creditsInYear(t,y){var cr=distTaxById(t),s=0;S.distributions.forEach(function(d){if(d.trustId===t.id&&d.date&&taxYearOf(d.date)===y)s+=(cr[d.id]&&cr[d.id].taxCredit)||0;});return s;}

function returnStatus(t,ry){

  var it=trustIncomeTax(t,ry),cg=calcCGTYear(t,ry),why=[];

}

    +fRow('21.6','Any '+Y+' tax refunded directly by HMRC',fAmt('21.6','',null))
    +fRow('21.7 / 21.8','Disclosure of tax avoidance schemes: scheme or promoter reference number; tax year the advantage arises','');
  // Page 12: Q22 and 21.9
  var info='';
  if(si&&special&&incD.length){info='Discretionary payments where the income is taxed on the settlor (not included in Q14): '+incD.map(function(d){return ben(d.beneficiaryId).name+' \u00A3'+(Number(d.amount)||0).toFixed(2)+' ('+fd(d.date)+')'}).join('; ')+'.';}
  var p12=fRow('21.9','Additional information',fTxt('21.9',info,420))
    +(info?fNote('HMRC asks for each payment\'s actual amount and the beneficiary\'s name here (SA950 page 23).'):'')
    +'<div class="sec">Q22 Declaration</div><div class="p">I have filled in and I\'m sending back to you the following Trust and Estate Tax Return pages:</div>'
    +fRow('','1 to 12 of this form',fTick('22.pages',true))
    +fRow('','Trust and estate trade',fTick('22.trade',false))+fRow('','Trust and estate partnership',fTick('22.partnership',false))
    +fRow('','Trust and estate UK property',fTick('22.property',rent>0))+fRow('','Trust and estate foreign',fTick('22.foreign',false))
    +fRow('','Trust and estate capital gains',fTick('22.gains',gains.length>0))+fRow('','Trust and estate non-residence',fTick('22.nonres',false))
    +fRow('','Trust and estate charities',fTick('22.charities',false))
    +fRow('22.1','The information I have given in this tax return is correct and complete to the best of my knowledge and belief. Signature and date',fTxt('22.1','',240))
    +fRow('22.2','Please print your name',fTxt('22.2','',240))
    +fRow('22.3','Enter the capacity in which you\'re signing',fTxt('22.3','Trustee',160))
    +fNote('Every trustee who signs must check the whole return first, even if an accountant prepared it.');

  var pages=[p1,p2,p3,p4,p5,p6,p7,p8,p9,p10,p11,p12].map(function(b,i){return fPage(V,i+1,FOOT,VER,b);}).join('');
  openForm(fDoc('SA900 '+Y+' \u2014 '+t.name,bar,pages));
};

// ============================================================
// STARTUP
// ============================================================
function startApp(){
  var app=document.getElementById('app');
  if(app)app.innerHTML='<div style="padding:60px 20px;text-align:center;color:#64748b;font-family:system-ui,sans-serif"><div style="font-size:32px;margin-bottom:12px">\u2696</div><div style="font-size:15px;font-weight:600;color:var(--brand);margin-bottom:6px">Trust Manager</div><div style="font-size:13px">Loading\u2026</div></div>';

  if(!sbConfigured){init();return;}

  var script=document.createElement('script');
  script.src=SUPABASE_JS_URL;
  script.onload=function(){
    try{
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      sb.auth.onAuthStateChange(function(event,session){
        // Deferred with setTimeout: Supabase warns that calling other Supabase
        // methods directly inside this callback can deadlock.
        setTimeout(function(){
          if((event==='SIGNED_IN'||event==='INITIAL_SESSION')&&session&&!currentUser){
            currentUser=session.user;authStep='form';loadFromCloud();
          } else if(event==='SIGNED_OUT'&&currentUser){
            // Session ended (e.g. expired elsewhere). Keep unsynced changes on the
            // device so they upload when the same person signs back in.
            resetSession(pendingCount()===0);
          }
        },0);
      });
    }catch(e){console.warn('Supabase client failed:',e);sbConfigured=false;}
    init();
  };
  script.onerror=function(){console.warn('Supabase failed to load — local mode');sbConfigured=false;init();};
  document.head.appendChild(script);
}

async function init(){
  if(sbConfigured&&sb){
    try{
      var res=await sb.auth.getSession();
      var session=res&&res.data?res.data.session:null;
      if(session){
        // Guard: the auth listener may already have started loading.
        if(!currentUser){currentUser=session.user;await loadFromCloud();}
        return;
      }
    }catch(e){console.warn('Session check failed:',e);}
    // Cloud mode, not signed in: show the sign-in screen only.
    // FIX: do not load any cached records into the page behind the overlay.
    R();
    return;
  }
  // Local mode
  var cached=readCache();
  if(cached){S=cached;if(S.trusts.length>0){AT=S.trusts[0].id;CV='today';}}
  R();
}

// Retry pending uploads when the connection comes back
window.addEventListener('online',function(){if(currentUser&&sb&&pendingCount()>0)retrySync();});
// Warn before closing the tab while a save is still in flight
window.addEventListener('beforeunload',function(e){if(syncStatus==='syncing'){e.preventDefault();e.returnValue='';}});

window.addEventListener('DOMContentLoaded',function(){
  try{startApp();}
  catch(e){
    console.error('Startup error:',e);
    var app=document.getElementById('app');
    if(app)app.innerHTML='<div style="padding:40px;text-align:center;font-family:system-ui,sans-serif"><p style="color:#dc2626;font-size:14px">Something went wrong loading Trust Manager.</p><p style="color:#64748b;font-size:12px;margin-top:8px">Try refreshing the page.</p></div>';
  }
});
</script>
