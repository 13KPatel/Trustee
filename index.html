<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trust Manager">
<title>Trust Manager</title>
<style>
:root{--brand:#14213D;--brass:#B08D57;--brand-tint:#F1F3F8;--brand-line:#D5DBE8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f7f5f2;color:var(--brand);min-height:100vh;-webkit-text-size-adjust:100%}
h1,h2,h3{font-weight:700}
button{font-family:inherit}
.header{background:var(--brand);border-bottom:3px solid var(--brass);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50}
.header h1{color:#fff;font-size:18px}
.header-sub{font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:1px;margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.header select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:6px 10px;color:#fff;font-size:13px;outline:none}
.header select option{color:#000}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;padding:10px 20px}
.btn:active{opacity:0.7}
.btn-primary{background:var(--brand);color:#fff}
.btn-accent{background:var(--brand);color:#fff}
.btn-ghost{background:transparent;color:#64748b;border:1px solid #e5e1dc}
.btn-danger{background:transparent;color:#dc2626;border:1px solid #fecaca}
.btn-header{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
.btn-sm{padding:6px 14px;font-size:12px}
.card{background:#fff;border:1px solid #e5e1dc;border-radius:12px;padding:18px 20px;margin-bottom:10px}
.card-click{cursor:pointer}
.card-click:active{border-color:#cbd5e1}
.tabs{display:flex;border-bottom:1px solid #e5e1dc;padding:14px 20px 0;overflow-x:auto;gap:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 0;margin-right:16px;border:none;background:none;border-bottom:2px solid transparent;color:#64748b;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.tab.active{color:var(--brand);font-weight:700;border-bottom-color:var(--brass)}
.content{max-width:960px;margin:0 auto;padding:20px 20px 60px}
.label{font-size:11px;font-weight:600;color:#64748b;margin-bottom:5px;display:block}
.input,.sel,.textarea{background:#faf9f7;border:1px solid #e5e1dc;border-radius:8px;padding:10px 14px;color:var(--brand);font-size:14px;font-family:inherit;outline:none;width:100%;box-sizing:border-box}
.input:focus,.sel:focus,.textarea:focus{border-color:var(--brand)}
.sel{cursor:pointer}
.textarea{min-height:80px;resize:vertical;line-height:1.6}
.fg{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.kl{font-size:10px;letter-spacing:1.5px;color:#64748b;text-transform:uppercase;margin-bottom:4px}
.kv{font-size:20px;font-weight:700}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;display:inline-block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:540px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.18)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mh h3{font-size:18px}
.mc{background:none;border:none;font-size:22px;color:#64748b;cursor:pointer;padding:4px}
.empty{text-align:center;padding:50px 20px;color:#64748b}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:16px;margin-top:16px}
.wt{font-size:13px;font-weight:700;color:#92400e;margin-bottom:4px}
.wb{font-size:12px;color:#92400e;line-height:1.7}
.info{background:var(--brand-tint);border:1px solid var(--brand-line);border-radius:10px;padding:14px;margin-bottom:14px}
.info-t{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:3px}
.info-b{font-size:12px;color:var(--brand);line-height:1.6}
.tax-result{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px;margin-bottom:14px}
.tax-result.warning{background:#fef2f2;border-color:#fecaca}
.tax-result .tr-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin-bottom:4px}
.tax-result .tr-value{font-size:22px;font-weight:700;color:#059669}
.tax-result.warning .tr-value{color:#dc2626}
.tax-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e1dc;font-size:13px}
.tax-row:last-child{border-bottom:none}
.tax-row span:last-child{font-weight:700}
.auth-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-box{background:#fff;border-radius:16px;padding:32px 28px;max-width:400px;width:100%}
/* Onboarding home page */
.ob-step{display:flex;gap:14px;padding:16px 18px;background:#fff;border:1px solid #e5e1dc;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.ob-step:active{opacity:0.85}
.ob-step.active-step{border-color:var(--brand);border-left:3px solid var(--brand)}
.ob-step.done-step{border-color:#e5e1dc;background:#fafaf9}
.ob-step.pending-step{opacity:0.55;cursor:default}
.ob-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:2px}
.ob-num.done{background:#dcfce7;color:#166534}
.ob-num.active{background:var(--brand);color:#fff}
.ob-num.pending{background:#f1f5f9;color:#94a3b8}
.ob-body{flex:1;min-width:0}
.ob-title{font-size:14px;font-weight:700;margin-bottom:3px}
.ob-desc{font-size:12px;color:#64748b;line-height:1.6}
.ob-cta{font-size:12px;font-weight:600;color:var(--brand);margin-top:6px;display:inline-block}
.ob-tick{font-size:18px;flex-shrink:0;align-self:center}
.about-box{background:var(--brand);border-radius:14px;padding:24px;margin-bottom:20px;color:#fff}
.about-box h2{font-size:18px;margin-bottom:8px;color:#fff}
.about-box p{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.75}
.about-box .ab-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.about-box .ab-tag{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7)}
/* Guide page */
.guide-search{background:#fff;border:1px solid #e5e1dc;border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;width:100%;margin-bottom:12px}
.guide-search:focus{border-color:var(--brand)}
.gcats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.gcat{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid #e5e1dc;background:#fff;color:#64748b;cursor:pointer;font-weight:500;white-space:nowrap}
.gcat.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.ge{background:#fff;border:1px solid #e5e1dc;border-radius:12px;margin-bottom:8px;overflow:hidden}
.ge-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;cursor:pointer}
.ge-head:hover{background:#fafaf9}
.ge-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.ge-title{font-size:14px;font-weight:700;flex:1}
.ge-summary{font-size:12px;color:#64748b;margin-top:2px;line-height:1.5}
.ge-chevron{font-size:16px;color:#94a3b8;flex-shrink:0;transition:transform .2s}
.ge-chevron.open{transform:rotate(180deg)}
.ge-body{display:none;padding:0 16px 16px;border-top:1px solid #f1f5f9}
.ge-body.open{display:block}
.ge-body p{font-size:13px;color:#475569;line-height:1.75;margin-top:12px}
.ge-body p:first-child{margin-top:12px}
.ge-body strong{color:var(--brand);font-weight:600}
.ge-example{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;margin-top:12px}
.ge-example-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--brand);text-transform:uppercase;margin-bottom:8px}
.ge-example p{font-size:12px;color:#334155;line-height:1.7;margin-top:0}
.ge-example p+p{margin-top:6px}
.ge-sources{font-size:11px;color:#64748b;margin-top:12px;line-height:1.6}.ge-sources a{color:var(--brand)}
.guide-empty{text-align:center;padding:40px 20px;color:#64748b;font-size:13px}
.cat-header{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#64748b;text-transform:uppercase;margin:20px 0 8px 2px}
.cat-header:first-child{margin-top:0}
@media(max-width:600px){.g2,.g3,.g4,.two-col{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr 1fr}.header{padding:12px 16px}.tabs{padding:10px 16px 0}.content{padding:16px 16px 60px}.ob-step{gap:10px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.hint{font-size:11px;color:#64748b;margin-top:5px;line-height:1.5}
.linkbtn{background:none;border:none;padding:0;color:var(--brand);font-size:inherit;font-weight:600;cursor:pointer;text-decoration:underline;font-family:inherit}
.tc-card{background:#fff;border:1px solid var(--line,#e5e1dc);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tc-card.tc-bad{border-color:#fecaca}
.tc-k{font-size:11px;color:#64748b;margin-bottom:4px}
.tc-a{font-size:16px;font-weight:700;line-height:1.4}
.tc-w{font-size:13px;color:#475569;margin-top:4px;line-height:1.6}
.tc-sub{border:1px solid #e5e1dc;border-radius:10px;padding:10px 12px;margin-top:10px}
.tc-fold{margin-top:10px}
.tc-fold>summary,.src>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--brand);list-style:none}
.tc-fold>summary::-webkit-details-marker,.src>summary::-webkit-details-marker{display:none}
.tc-fold>summary::before,.src>summary::before{content:'\25B8  '}
.tc-fold[open]>summary::before,.src[open]>summary::before{content:'\25BE  '}
.tc-body{background:var(--brand-tint);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px}
.tc-body .tax-row{padding:5px 0;font-size:12px}
.src{margin-top:6px}.src>div{background:var(--brand-tint);border-radius:6px;padding:6px 8px;margin-top:4px;font-size:11px;color:#475569;line-height:1.6}
.term{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:help;border-bottom:1.5px dotted var(--brand)}
.term:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
#term-pop{position:absolute;z-index:400;max-width:300px;background:#fff;border:1px solid var(--brand-line);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(20,33,61,.12);font-size:12px;line-height:1.5;color:var(--brand)}
#term-pop .tp-t{font-weight:700;color:var(--brand);margin-bottom:3px}
.tmenu{position:relative}
.tmenu>summary{list-style:none;cursor:pointer;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.tmenu>summary::-webkit-details-marker{display:none}
.tmenu-list{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:#fff;border:1px solid var(--brand-line);border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(20,33,61,.15);z-index:300}
.tmenu-list button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 14px;font-size:13px;color:var(--brand);cursor:pointer;font-family:inherit}
.tmenu-list button:hover{background:var(--brand-tint)}
.tmenu-h{font-size:11px;color:#64748b;padding:8px 14px 4px}
.glance{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.glance>div{background:#fff;border:1px solid #e5e1dc;border-radius:10px;padding:10px 12px}
.glance .gk{font-size:11px;color:#64748b}.glance .gv{font-size:17px;font-weight:700;margin-top:2px}
.moments{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.moment{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:#fff;border:1px solid #e5e1dc;border-radius:12px;padding:16px;cursor:pointer;font-family:inherit;color:var(--brand)}
.moment:hover{border-color:var(--brand)}.moment:active{opacity:.8}
.moment-t{font-size:15px;font-weight:700}.moment-s{font-size:12px;color:#64748b;line-height:1.4}
.preview{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:14px;color:#334155}
</style>
</head>
<body>
<input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="handleImportFile(event)">
<div id="app"></div>
<script>
/*
================================================================
SETUP: 3 steps before deploying

STEP 1: Replace SUPABASE_URL and SUPABASE_ANON_KEY below.
  Supabase dashboard > Project Settings > API (or "API Keys").
  Use the Project URL and the PUBLISHABLE key (starts sb_publishable_)
  or the legacy "anon" key. NEVER paste the secret / service_role key:
  this file is public on GitHub Pages.

STEP 2: Run this SQL in the Supabase SQL Editor (once):

create table if not exists user_trusts (
  user_id uuid not null references auth.users on delete cascade,
  trust_id text not null,
  trust_data jsonb not null default '{}',
  updated_at timestamptz not null default now(),
  primary key (user_id, trust_id)
);
alter table user_trusts enable row level security;
create policy "users access own trusts only"
  on user_trusts for all
  using (auth.uid() = user_id)
  with check (auth.uid() = user_id);

  (If you already created user_trusts with the old SQL and it is empty,
  run "drop table user_trusts;" first, then the SQL above.)

STEP 3: Supabase dashboard > Authentication > URL Configuration:
  Site URL      = your GitHub Pages address, e.g. https://USERNAME.github.io/REPO/
  Redirect URLs = add the same address
  Without this, magic-link emails will not bring people back to the app.
================================================================
*/

var SUPABASE_URL = 'https://YOUR-PROJECT-ID.supabase.co';
var SUPABASE_ANON_KEY = 'YOUR-PUBLISHABLE-KEY-HERE';
// Pinned to an exact, tested release. Only change this deliberately.
var SUPABASE_JS_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js';

// ============================================================
// APP STATE
// ============================================================
var SK="trust-manager-v2";
var DIRTY_KEY=SK+'-dirty';            // trust ids with changes not yet in the cloud
var DEL_KEY=SK+'-pending-deletes';    // trust ids deleted locally, not yet deleted in the cloud
var OWNER_KEY=SK+'-owner';            // user id the local cache belongs to
var DATA_VERSION=1; // bump this if the saved-data shape ever changes
var TT=["Discretionary","Bare","Interest in Possession","Life Interest","Will Trust","Mixed","Charitable"];
var CO=["#14213D","#059669","#d97706","#dc2626","#7c3aed","#0891b2","#be185d","#65a30d"];
var ME=["Bank Transfer","Cheque","Cash","In-Kind"];
var DCT=["Distribution","Investment","Tax","Administrative","Beneficiary Change","Trustee Change","Property","Other"];
var ITP=["Interest","Dividends","Rental Income","Sale Proceeds","Insurance","Other"];
var ECA=["Legal Fees","Accountancy","Tax Payment","Insurance","Property Maintenance","Bank Charges","Valuation","Other"];
var DTP=["Income - Non-Savings","Income - Savings","Income - Dividends","Capital"];
var NRB=325000;
function emptyState(){return{trusts:[],beneficiaries:[],trustees:[],distributions:[],decisions:[],income:[],expenses:[],gains:[]};}
var S=emptyState();
var AT=null,CV="home",MT=null,MD={};
var currentUser=null;
var syncStatus='idle';
var authStep='form';
var authEmail='';
var sb=null;
var sbConfigured=(SUPABASE_URL.indexOf('YOUR-')===-1&&SUPABASE_ANON_KEY.indexOf('YOUR-')===-1);
var GQ=''; // guide search query
var GC='all'; // guide category filter
var TCY=null; // tax year chosen in the Tax Centre (null = this tax year)

// ============================================================
// GUIDE DATA
// ============================================================
var GD=[
  // TRUST TYPES
  {id:'discretionary',cat:'trust-types',color:'#7c3aed',title:'Discretionary trust',summary:'Trustees decide who benefits, how much, and when.',
   body:'<p>A discretionary trust gives the trustees complete flexibility. No single beneficiary has a fixed right to any income or capital — trustees decide how to distribute funds from a class of potential beneficiaries named in the deed.</p><p>This flexibility makes discretionary trusts the most common choice for IHT planning, but it comes with the most complex tax treatment. The trust is taxed as a separate entity at the <strong>Rate Applicable to Trusts</strong> (45% on income, 39.35% on dividends). Trustees should give beneficiaries an <strong>R185</strong> when they pay out income (and must if asked in writing).</p><p>For IHT, discretionary trusts sit inside the <strong>relevant property regime</strong> — meaning they face a 10-year periodic charge and exit charges when capital leaves.</p>',
   example:'<p>The Smith Family Trust has three potential beneficiaries: two adult children and a grandchild. Each year, trustees review the family\'s circumstances and decide whether to distribute income and how much to each person. One year they may give everything to the grandchild for school fees; the next year nothing at all. That discretion is protected by the trust deed.</p>'},
  {id:'bare',cat:'trust-types',color:'#059669',title:'Bare trust',summary:'Beneficiary owns the assets outright — the trustee is just a nominee.',
   body:'<p>A bare trust is the simplest form. The beneficiary has an <strong>absolute, immediate right</strong> to both the income and the capital. The trustee holds the assets in name only — they cannot exercise any discretion over how or when assets are distributed.</p><p>Bare trusts are <strong>transparent for tax purposes</strong> — HMRC treats the assets as if the beneficiary owns them directly. The beneficiary pays tax on income and gains at their own rates, not the trust rates. This makes bare trusts tax-efficient if the beneficiary is a basic-rate taxpayer or non-taxpayer.</p><p><strong>Exception for parents:</strong> if a parent sets up the trust for their own unmarried child under 18, any income over £100 a year is taxed on the parent until the child turns 18 (ITTOIA 2005 s.629). Gains are still the child\'s.</p><p>Commonly used to hold assets for children until they turn 18, or for straightforward nominee arrangements.</p>',
   example:'<p>A parent sets up a bare trust holding £50,000 of shares for their child. The child has an absolute right to the shares and all dividends. When the child turns 18, the parent (as trustee) simply transfers the shares into the child\'s own name. Because a parent set the trust up for their own child, any dividends over £100 a year are taxed on the parent until the child turns 18 (s.629). If a grandparent had set it up, the dividends would be taxed on the child.</p>'},
  {id:'iip',cat:'trust-types',color:'#0891b2',title:'Interest in possession trust',summary:'One beneficiary has the right to income now; others receive capital later.',
   body:'<p>In an interest in possession (IIP) trust, the <strong>life tenant</strong> has a legal right to receive all the income from the trust assets as it arises. A second group of beneficiaries (called <strong>remaindermen</strong>) will receive the capital when the trust ends — usually on the life tenant\'s death.</p><p>The trustees pay income tax at the basic rate (20%) on non-dividend income and the dividend ordinary rate on dividends (10.75% from 6 April 2026; 8.75% before). If the trust\'s total income for the year is £500 or less, they pay nothing (the de minimis). The life tenant then declares the gross income on their own Self Assessment return and claims credit for the tax already paid. This means the effective rate matches the life tenant\'s own marginal rate.</p><p>For IHT purposes, if the IIP arose before 22 March 2006, the assets are treated as part of the life tenant\'s estate — <strong>not</strong> the relevant property regime. Post-2006 IIPs in new trusts are generally treated as relevant property unless they qualify as an IPDI.</p>',
   example:'<p>A widow is the life tenant of her late husband\'s will trust. She receives all income (rental income from a property held in trust) during her lifetime. On her death, the property passes to their children. The property is treated as part of her estate for IHT, not subject to the 10-year periodic charge.</p>'},
  {id:'will-trust',cat:'trust-types',color:'#d97706',title:'Will trust',summary:'Created by a will — comes into existence when the testator dies.',
   body:'<p>A will trust (also called a testamentary trust) is set up by the terms of someone\'s will. It only comes into existence when the person dies and their estate is administered. The deceased\'s personal representatives transfer the relevant assets into the trust.</p><p>Common types include trusts for minor children (so they don\'t inherit outright at 18) and trusts for a surviving spouse with children from a previous relationship. The tax treatment depends entirely on what type of trust the will creates — discretionary, IIP, bare, etc.</p><p>An <strong>Immediate Post-Death Interest (IPDI)</strong> is a special category: an IIP that arises immediately from a will trust. The assets are treated as part of the life tenant\'s estate for IHT, not as relevant property.</p>',
   example:'<p>A father\'s will leaves his estate in trust for his three children, to be distributed when the youngest turns 25. Until then, trustees can apply income for the children\'s education and maintenance (s.31 Trustee Act 1925 power). If this is a discretionary will trust, the 10-year charge applies from the 10th anniversary of the father\'s death. (Some will trusts for children, such as 18-25 trusts, follow special rules: check with an adviser.)</p>'},
  {id:'charitable',cat:'trust-types',color:'#be185d',title:'Charitable trust',summary:'Established for charitable purposes — exempt from most UK tax.',
   body:'<p>A charitable trust must exist solely for purposes that are charitable under the Charities Act 2011 (relief of poverty, education, religion, health, community benefit, etc.). It must register with the Charity Commission if its income exceeds £5,000 a year.</p><p>Charitable trusts are exempt from income tax on most income, exempt from CGT, and entirely outside the IHT relevant property regime — no 10-year charges, no exit charges. Donations to the trust may also qualify for Gift Aid, increasing their value by 25%.</p><p>Trustees of charitable trusts have additional obligations under charity law, including annual accounts filed with the Charity Commission and a duty to further the charitable objects only.</p>',
   example:''},

  // PEOPLE
  {id:'settlor',cat:'people',color:'var(--brand)',title:'Settlor',summary:'The person who creates the trust and puts assets into it.',
   body:'<p>The settlor is the person who sets up the trust and transfers assets into it. In a family trust, this is usually a parent or grandparent doing IHT planning. In a will trust, the settlor is the deceased person.</p><p>The settlor\'s personal tax position matters significantly to the trust\'s tax calculations. Specifically: any <strong>Chargeable Lifetime Transfers (CLTs)</strong> the settlor made in the 7 years before setting up this trust reduce the nil-rate band available to the trust for its 10-year periodic charge. The number of trusts the settlor has created also affects the CGT Annual Exempt Amount each trust gets.</p><p>If the settlor (or their spouse) can benefit from the trust — even indirectly — it becomes a <strong>settlor-interested trust</strong>, which has very different income tax treatment (all income is taxed on the settlor at their marginal rate).</p>',
   example:''},
  {id:'trustee',cat:'people',color:'var(--brand)',title:'Trustee',summary:'Legally responsible for managing the trust — you.',
   body:'<p>Trustees hold the trust assets in their own names but for the benefit of the beneficiaries. You have personal legal responsibility for every decision made in the administration of the trust. This is not a formality — if you breach your duties, you can be personally liable to the beneficiaries for any loss caused.</p><p>Your key duties include the statutory duty of care and the standard investment criteria in the <strong>Trustee Act 2000</strong>, and, under general trust law, keeping proper accounts and records and acting in the best interests of all beneficiaries, present and future.</p><p>There is no legal minimum or maximum number of trustees, but most trusts have two to four. A sole trustee can act, but it is not advisable — having at least two trustees provides a safeguard and is required for some transactions (e.g. receipt of capital money from land).</p>',
   example:''},
  {id:'beneficiary',cat:'people',color:'var(--brand)',title:'Beneficiary',summary:'The person or people who benefit from the trust assets.',
   body:'<p>Beneficiaries are those who are entitled (or potentially entitled) to benefit from the trust. In a discretionary trust, beneficiaries have no automatic right to anything — trustees decide who gets what. In a bare trust or IIP trust, beneficiaries have fixed entitlements.</p><p>Beneficiaries of discretionary trusts do not have an automatic right to see the trust accounts, but courts can order disclosure. Keeping clear records protects trustees from disputes.</p><p>Each beneficiary\'s own tax position matters when planning distributions — a basic-rate taxpayer beneficiary receiving income from a discretionary trust can reclaim some of the 45% tax credit paid by the trust, whereas a non-taxpayer may be able to reclaim it all.</p>',
   example:''},
  {id:'protector',cat:'people',color:'var(--brand)',title:'Protector',summary:'An optional appointment with powers to oversee or veto trustee decisions.',
   body:'<p>A protector is a person named in the trust deed with specific powers — typically to remove and replace trustees, or to veto certain decisions (such as adding beneficiaries or making large capital distributions). Not all trusts have a protector; it is an optional feature more common in offshore or complex family trusts.</p><p>The role is a safeguard for the settlor: it allows someone trusted by the settlor to keep oversight without being a trustee themselves. The powers of a protector are defined entirely by the trust deed — there is no standard statutory role.</p>',
   example:''},

  // TAX
  {id:'clt',cat:'tax',color:'#dc2626',title:'Chargeable lifetime transfer (CLT)',summary:'A gift into a discretionary trust — it uses up the nil-rate band.',
   body:'<p>When a settlor transfers assets into a discretionary trust while alive, HMRC treats this as a <strong>Chargeable Lifetime Transfer (CLT)</strong>. CLTs are added together on a rolling 7-year basis. If cumulative CLTs exceed the nil-rate band (£325,000), the excess is charged to IHT at <strong>20%</strong> on entry into the trust (the "entry charge"), if the trustees pay the tax. If the settlor pays it instead, the gift is grossed up, so the tax is 25% of the excess.</p><p>CLTs matter beyond the entry charge. In the 7 years before the trust was established, any prior CLTs the settlor made eat into the nil-rate band available for the trust\'s 10-year periodic charge. This is why the "Settlor Prior CLTs" field in the trust setup is important — entering an incorrect figure will give the wrong periodic charge calculation.</p><p>After 7 years, a CLT drops out of the cumulative total — so older gifts become irrelevant for future calculations.</p>',
   example:'<p><strong>Entry charge example:</strong></p><p>Settlor has made no prior CLTs. They put £500,000 into a discretionary trust. The NRB is £325,000. The excess is £175,000. Entry charge = £175,000 × 20% = <strong>£35,000</strong> due on setting up the trust.</p><p>If they had made prior CLTs of £200,000 within 7 years, only £125,000 NRB would remain. Excess = £375,000. Entry charge = £375,000 × 20% = <strong>£75,000</strong>.</p><p>If the settlor paid the tax in the first case, the £175,000 is grossed up: £175,000 ÷ 0.8 × 20% = <strong>£43,750</strong>.</p>'},
  {id:'nrb',cat:'tax',color:'#dc2626',title:'Nil-rate band (NRB)',summary:'The threshold below which no IHT is charged — currently £325,000.',
   body:'<p>The nil-rate band is the amount anyone can transfer — whether in life or on death — before IHT applies. It has been frozen at <strong>£325,000</strong> since 2009 and is currently frozen until at least 5 April 2031.</p><p>Everyone has their own nil-rate band. For trusts, the NRB available to the trust for its 10-year periodic charge is reduced by any CLTs the settlor made in the 7 years before creating the trust.</p><p>The <strong>Residence Nil-Rate Band (RNRB)</strong> of up to £175,000 is an additional allowance for passing a family home to direct descendants — but it is not available to assets held in discretionary trusts. This is a significant planning point if the trust holds property.</p>',
   example:'<p>A settlor created Trust A in 2018 with £150,000 (a CLT). In 2023 they create Trust B with £400,000. When calculating Trust B\'s 10-year periodic charge: the NRB available to Trust B = £325,000 − £150,000 (prior CLT, within 7 years) = <strong>£175,000</strong>. The periodic charge is calculated on the excess above £175,000, not £325,000.</p>'},
  {id:'10yr',cat:'tax',color:'#dc2626',title:'10-year periodic charge',summary:'IHT charged on the trust\'s value every 10 years — up to 6%.',
   body:'<p>Every 10 years from the date the trust was established, HMRC charges IHT on the value of the relevant property in the trust. The maximum effective rate is 6%, but most trusts pay significantly less.</p><p>The calculation works in 4 steps:</p><p><strong>Step 1:</strong> Take the value of the trust on the anniversary.</p><p><strong>Step 2:</strong> Work out the nil-rate band available: £325,000, less the settlor\'s chargeable gifts in the 7 years before the trust was set up, less any capital that left the trust (and was charged to exit tax) in the previous 10 years.</p><p><strong>Step 3:</strong> Calculate the "lifetime tax" on the excess at 20%, then find the effective rate: lifetime tax ÷ hypothetical transfer.</p><p><strong>Step 4:</strong> The periodic charge rate = effective rate × 30%. Tax due = periodic charge rate × current trust value.</p>',
   example:'<p><strong>Step-by-step worked example:</strong></p><p>Trust value today: £600,000. No prior CLTs. No capital distributions. NRB: £325,000.</p><p>Step 1 — Hypothetical transfer: £600,000</p><p>Step 2 — Excess over NRB: £600,000 − £325,000 = £275,000</p><p>Step 3 — Lifetime tax: £275,000 × 20% = £55,000. Effective rate: £55,000 ÷ £600,000 = 9.167%</p><p>Step 4 — Periodic rate: 9.167% × 30% = 2.75%. Tax due: £600,000 × 2.75% = <strong>£16,500</strong></p><p>If £100,000 of capital had been paid out during those 10 years, the nil-rate band available falls to £225,000. Excess £375,000, tax £75,000, effective rate 12.5%, periodic rate 3.75%: tax due <strong>£22,500</strong>.</p>'},
  {id:'exit',cat:'tax',color:'#dc2626',title:'Exit charge',summary:'IHT charged when capital leaves the trust between anniversaries.',
   body:'<p>When capital leaves a discretionary trust, through a capital payment to a beneficiary or a transfer of property out of the trust, HMRC charges an exit charge. How the rate is worked out depends on whether the trust has had its first 10-year anniversary.</p><p><strong>Before the first anniversary:</strong> the rate comes from what the settlor <strong>originally put in</strong>, not what the trust is worth now. Take the excess over the nil-rate band available, charge it at 20%, turn that into a percentage of the amount put in, and multiply by 3/10. Then multiply by the number of complete quarters since the trust started, out of 40.</p><p><strong>After an anniversary:</strong> the rate is the rate charged at that anniversary, multiplied by the complete quarters since it, out of 40.</p><p>There is no exit charge in the first three months after the trust starts or after an anniversary. Payments out of a <strong>will trust</strong> within two years of the death are treated as made by the will itself, with no exit charge (s.144).</p><p>Exit charges apply only to <strong>capital</strong>. Income payments do not trigger them, but may need an R185.</p>',
   example:'<p>A trust was set up with £500,000 and the settlor had made no earlier chargeable gifts. Five years and a few days later, the trustees pay out £100,000. The trust is now worth £900,000, but that does not affect this calculation.</p><p>Excess over the nil-rate band: £500,000 − £325,000 = £175,000. Tax at 20% = £35,000, which is 7% of £500,000. Initial rate: 7% × 3/10 = 2.1%. After 20 complete quarters: 2.1% × 20/40 = <strong>1.05%</strong>, so the exit charge is <strong>£1,050</strong>.</p><p>If the trust pays the tax on top instead of taking it from the payment, the payment is grossed up: £100,000 ÷ (1 − 1.05%) = £101,061, and the tax is £1,061.</p>'},
  {id:'cgt',cat:'tax',color:'#dc2626',title:'Capital Gains Tax for trusts',summary:'Trusts pay 24% CGT on gains above a £1,500 annual exempt amount.',
   body:'<p>When a trust disposes of a capital asset (sells shares, sells property, transfers assets to a beneficiary), any gain above the base cost is subject to Capital Gains Tax.</p><p>For 2025/26 and 2026/27 the rate is a flat <strong>24%</strong> for all assets (following the October 2024 Autumn Budget, which equalised the residential and non-residential rates).</p><p>The <strong>Annual Exempt Amount (AEA)</strong> for trusts is £1,500, shared between the trusts the same settlor has made since 7 June 1978, with a minimum of £300 each. Trusts made before then keep the full £1,500.</p><p>Each tax year is worked out separately. Losses of the same year are set against its gains first, even if that wastes the exempt amount. Unused losses carry forward, and are only used to bring a later year\'s gains down to the exempt amount. In a bare trust the gains are the beneficiary\'s, and charitable trusts are generally exempt. When assets are distributed from a discretionary trust to a beneficiary, <strong>s.260 hold-over relief</strong> may be available — meaning no immediate CGT is payable and the beneficiary inherits the trust\'s base cost instead.</p><p>Residential property disposals must be reported online and any CGT paid within <strong>60 days</strong> of completion, not just at the annual SA900.</p>',
   example:'<p>A trust (one of three trusts created by the same settlor) sells shares for a gain of £8,000. AEA = £1,500 ÷ 3 = £500. Taxable gain = £8,000 − £500 = £7,500. CGT = £7,500 × 24% = <strong>£1,800</strong>.</p>'},
  {id:'income-tax',cat:'tax',color:'#dc2626',title:'Trust income tax rates',summary:'Discretionary trusts pay 45% on income and 39.35% on dividends, unless total income is £500 or less.',
   body:'<p>The tax rate on trust income depends on the type of trust:</p><p><strong>Discretionary trusts:</strong> Pay the Rate Applicable to Trusts: 45% on non-savings and savings income, 39.35% on dividend income. There is no lower band. The old £1,000 standard rate band was abolished from 6 April 2024 (Finance (No.2) Act 2023).</p><p><strong>The £500 de minimis:</strong> If a trust\'s total income for the tax year is £500 or less, the trustees pay no income tax on it and do not need to report it. This is a cliff edge, not a band: if income is even £1 over the limit, <strong>all</strong> of it is taxed. Where the settlor has made other discretionary trusts that have taxable income (leaving out any where the settlor can benefit), the £500 is shared: £500 ÷ the number of those trusts including this one, but never below £100. Interest in possession trusts always keep the full £500.</p><p><strong>Interest in possession trusts:</strong> Trustees pay the basic rate (20%) on non-dividend income and the dividend ordinary rate on dividends (10.75% from 6 April 2026; 8.75% before). The same de minimis applies. The life tenant declares the gross income on their own Self Assessment and pays any further tax at their own rate.</p><p><strong>Bare trusts:</strong> Transparent. The beneficiary is taxed directly at their own rates as if they received the income themselves.</p>',
   example:'<p>A discretionary trust receives £8,000 of rental income. That is over £500, so all of it is taxed: £8,000 × 45% = <strong>£3,600</strong>, which goes into the tax pool.</p><p>Had the trust received only £450 of interest, no tax would be due. At £600, the whole £600 is taxed: £600 × 45% = <strong>£270</strong>.</p>'},
  {id:'tax-pool',cat:'tax',color:'#dc2626',title:'The tax pool',summary:'Checks that tax paid by the trust covers the 45% credits on distributions.',
   body:'<p>Every income payment from a discretionary trust carries a 45% tax credit. The <strong>tax pool</strong> (ITA 2007 s.497) checks that the trustees have actually paid enough tax to cover those credits. Tax the trustees pay on trust income goes in; the credit on each distribution comes out. Any balance carries forward to later years.</p><p>If the credits are more than the pool, the trustees must pay the difference to HMRC (s.496).</p><p><strong>The dividend trap:</strong> dividends are taxed in the trust at 39.35%, but a distribution of them still carries a 45% credit. Paying out all of a trust\'s after-tax dividend income therefore leaves a shortfall the trustees must pay.</p><p><strong>De minimis years:</strong> if the trust\'s income is within the £500 de minimis, no tax goes into the pool for that year, but a distribution may still carry a 45% credit. Check the position with your accountant before distributing in a low-income year.</p>',
   example:'<p>A trust receives £10,000 of dividends and pays £3,935 tax (39.35%), which goes into the pool. It then distributes the remaining £6,065.</p><p>Credit on the distribution: £6,065 × 45/55 = £4,962.27. Pool: £3,935. Shortfall the trustees must pay: <strong>£1,027.27</strong>.</p>'},
  {id:'tme',cat:'tax',color:'#dc2626',title:'Trust management expenses',summary:'Expenses paid from income reduce a discretionary trust\'s income tax.',
   body:'<p>Trust management expenses are the costs of running the trust. In a discretionary trust, those that are <strong>properly chargeable to income</strong> under general trust law reduce the income tax: the income used to pay them is taxed at the lower rates (20%, or 10.75% for dividends) instead of 45% or 39.35% (ITA 2007 s.484).</p><p><strong>What counts:</strong> typically accountancy for the trust\'s tax return and bank charges on the income account. Legal fees and other costs for the benefit of the whole trust are usually capital and do not count. Tax itself never counts. Costs of a let property are taken off the rent instead.</p><p><strong>How they are applied:</strong> grossed up and set against dividends first, then savings income, then other income. Any not used in a year carry forward. They do not affect the £500 de minimis test, and the tax on income they cover does not go into the tax pool.</p><p>In an interest in possession trust, expenses reduce the income the life tenant is entitled to rather than the trustees\' tax.</p>',
   example:'<p>A discretionary trust has £1,000 of dividends, £10,000 of interest and £1,200 of expenses paid from income in 2026/27.</p><p>£892.50 of the expenses covers all £1,000 of dividends (£892.50 ÷ 0.8925), taxed at 10.75% = £107.50. The remaining £307.50 covers £384.38 of interest (÷ 0.80), taxed at 20% = £76.88. The other £9,615.62 of interest is taxed at 45% = £4,327.03.</p><p>Total tax <strong>£4,511.41</strong>, against £4,893.50 with no expenses. Only the £4,327.03 at 45% goes into the tax pool.</p>'},
  {id:'seven-year',cat:'tax',color:'#dc2626',title:'The 7-year rule',summary:'Gifts made more than 7 years before death fall outside the IHT net.',
   body:'<p>Under the 7-year rule, Potentially Exempt Transfers (PETs) — outright gifts between individuals — become fully exempt from IHT if the donor survives 7 years after making them. Between years 3 and 7, taper relief reduces the IHT due.</p><p>CLTs (gifts into discretionary trusts) work differently. They are immediately chargeable when made. After 7 years they fall out of the donor\'s cumulative total, freeing up nil-rate band for future CLTs or the person\'s estate on death.</p><p>For trust calculations, the relevant question is: what CLTs did the settlor make in the <strong>7 years before setting up this trust</strong>? Those reduce the NRB available to the trust for periodic charges.</p>',
   example:''},
  {id:'bpr',cat:'tax',color:'#dc2626',title:'Business Property Relief (BPR)',summary:'Qualifying business assets can reduce or eliminate IHT charges.',
   body:'<p>Business Property Relief can reduce the taxable value of qualifying assets by either 50% or 100% for IHT purposes. This applies to periodic charges, exit charges, and entry charges on the portion of trust assets that qualify.</p><p><strong>100% relief</strong>: unquoted shares, a business or interest in a business (e.g. a partnership share).</p><p><strong>50% relief</strong>: shares in a quoted company where the transferor has voting control, or assets used in a business or by a company in which the transferor has a controlling interest.</p><p>The asset must generally have been held for at least 2 years. HMRC can challenge BPR where the business\'s main activity is holding or dealing in investments.</p><p><strong>From 6 April 2026:</strong> 100% relief applies only to the first £1 million of business and agricultural property combined, with 50% relief above that. Trustees get a £1 million allowance on each 10-year and exit charge (with special rules where a settlor has several trusts). AIM shares get 50% relief. Relief is not deducted when working out the exit charge rate before the first anniversary.</p><p>Because these rules are detailed, Trust Manager shows inheritance tax as an \"at most\" figure when you tell it the trust holds business or farm assets. Get professional advice.</p>',
   example:''},
  {id:'apr',cat:'tax',color:'#dc2626',title:'Agricultural Property Relief (APR)',summary:'Qualifying farmland and buildings can attract relief from IHT.',
   body:'<p>APR reduces the agricultural value of qualifying agricultural property by 50% or 100% for IHT purposes, including periodic and exit charges on trust assets.</p><p><strong>100% relief</strong>: owner-occupied farmland, or land let on a tenancy beginning on or after 1 September 1995 (or earlier tenancies where the landlord has been entitled to vacant possession within the last 12 months).</p><p><strong>50% relief</strong>: other agricultural tenancies.</p><p>Only the agricultural value attracts relief. Any additional development value or other non-agricultural value is not covered by APR (though BPR may apply to some of it).</p><p><strong>From 6 April 2026</strong> the same £1 million limit for 100% relief applies, shared with business property relief, with 50% relief above it.</p>',
   example:''},
  {id:'settlor-interested',cat:'tax',color:'#dc2626',title:'Settlor-interested trust rules',summary:'If the settlor can benefit from the trust, HMRC taxes income on them — not the trust.',
   body:'<p>A trust is "settlor-interested" if the settlor or their spouse or civil partner can benefit from the trust assets or income — even potentially or indirectly.</p><p>Under ITTOIA 2005 s.624, all trust income is treated as the settlor\'s own income for tax purposes. Instead of the trust paying 45%, the income is added to the settlor\'s personal income and taxed at their marginal rate. This can dramatically change the tax position — better if the settlor is a non-taxpayer; worse if they are an additional-rate taxpayer with no trust rate credit to offset.</p><p>This is an easy rule to trigger accidentally — for example, if the deed allows trustees to add the settlor as a beneficiary, or if the settlor retained the power to appoint assets back to themselves.</p><p><strong>Payments out:</strong> a payment to the settlor is not taxed on them again. A payment to anyone else is treated as having had tax paid at 45%, which they cannot reclaim (Box 2 of form R185 (Trust Income)). The settlor needs form R185 (Settlor) for the trust\'s income.</p><p><strong>The settlor\'s own children:</strong> income paid to or for the settlor\'s unmarried child under 18 is taxed on the settlor, not the child (ITTOIA 2005 s.629). This is a separate rule from settlor-interested trusts; get advice.</p>',
   example:''},

  // DISTRIBUTIONS
  {id:'income-dist',cat:'distributions',color:'#059669',title:'Income distribution',summary:'Paying out trust income to beneficiaries carries a 45% tax credit they can use.',
   body:'<p>When a discretionary trust pays income to a beneficiary, the payment is treated as made <strong>net of tax at 45%</strong> (ITA 2007 s.494). This applies whatever income funded it, including dividends the trust was taxed on at 39.35%. To find the gross amount, divide the payment by 0.55.</p><p>The beneficiary declares the gross amount on their own return and gets credit for the 45%. A non-taxpayer can reclaim all of it, a basic-rate taxpayer reclaims the difference between 45% and 20%, and a higher-rate taxpayer reclaims the difference between 45% and 40%.</p><p>The credit has to be covered by tax the trustees have actually paid, tracked in the <strong>tax pool</strong>. If the pool is too small, the trustees pay the shortfall (s.496).</p><p>Trustees should give an <strong>R185</strong> to every beneficiary who receives an income payment (and must if the beneficiary asks in writing), showing the net payment and the tax credit in Box 1.</p>',
   example:'<p>Based on HMRC\'s own example (TSEM3023): trustees pay £5,000 of income to beneficiaries. Gross: £5,000 × 100/55 = £9,090.91. Tax credit: <strong>£4,090.91</strong>. If the tax pool only holds £2,500, the trustees must pay the extra £1,590.91 to HMRC.</p><p>A basic-rate beneficiary receiving all £5,000 owes 20% of £9,090.91 = £1,818.18, so can reclaim £4,090.91 − £1,818.18 = <strong>£2,272.73</strong>.</p>'},
  {id:'capital-dist',cat:'distributions',color:'#059669',title:'Capital distribution',summary:'Paying out capital from the trust — may trigger an exit charge.',
   body:'<p>A capital distribution is a payment to a beneficiary out of the trust\'s capital rather than its income. This could be cash, or the transfer of a physical asset (property, shares).</p><p>Capital distributions from discretionary trusts may trigger an <strong>exit charge</strong> — a proportionate IHT charge based on the time elapsed since the last 10-year anniversary. The trustees must send form IHT100 and pay any tax within 6 months after the end of the month of the payment.</p><p>Capital distributions do not carry a tax credit in the same way income distributions do. However, if the trust transfers a capital asset to a beneficiary, this is a disposal for CGT purposes unless <strong>s.260 hold-over relief</strong> is claimed — which defers the gain and passes the base cost to the beneficiary.</p>',
   example:''},
  {id:'r185',cat:'distributions',color:'#059669',title:'R185: statement of trust income',summary:'Give one to each beneficiary paid income; required if they ask in writing.',
   body:'<p>Form R185 (Trust Income), the "Statement of income from trusts", is a statement trustees give to beneficiaries who received income from the trust in a tax year. It shows the gross amount of income treated as having been paid, and the amount of income tax already deducted.</p><p>Beneficiaries need the R185 to complete their own Self Assessment tax return. Without it, they cannot claim credit for the tax already paid by the trustees, and HMRC may assess them on the gross amount again.</p><p>There is no fixed deadline, but trustees <strong>must</strong> provide one if the beneficiary asks in writing (ITA 2007 s.975), and beneficiaries need it to complete their own tax return by 31 January. HMRC publishes the form on GOV.UK; Trust Manager fills it in from your records for you to check and sign.</p>',
   example:''},
  {id:'s31',cat:'distributions',color:'#059669',title:'Trustee Act 1925 s.31: maintenance',summary:'Power to use income for a beneficiary under 18.',
   body:'<p>Section 31 of the Trustee Act 1925 lets trustees use income for the <strong>maintenance, education or benefit</strong> of a beneficiary under 18, unless the trust deed says otherwise.</p><p>For trusts created, or interests arising, after <strong>1 October 2014</strong>, trustees may pay whatever they think fit. For older trusts the test is what is reasonable in all the circumstances (Inheritance and Trustees\' Powers Act 2014).</p><p>Income that is not used is normally accumulated. What happens to it when the beneficiary turns 18 depends on the terms of their interest, so check the deed or ask an adviser.</p><p>Record each decision and amount in the decision log.</p>',
   example:''},
  {id:'s32',cat:'distributions',color:'#059669',title:'Trustee Act 1925 s.32: advancement',summary:'Power to pay capital early: up to the whole share for trusts after 1 October 2014.',
   body:'<p>Section 32 of the Trustee Act 1925 lets trustees advance <strong>capital</strong> to a beneficiary early, for their advancement or benefit, unless the trust deed excludes it.</p><p>For trusts created or arising after <strong>1 October 2014</strong>, trustees can advance up to the <strong>whole</strong> of the beneficiary\'s presumptive share; for older trusts the limit is <strong>half</strong>. Trustees can also transfer assets, not just pay money (Inheritance and Trustees\' Powers Act 2014).</p><p>Anything advanced is taken into account when the beneficiary later becomes entitled. Anyone with a prior interest, such as a life tenant, must consent in writing. Record the reasoning in the decision log.</p>',
   example:''},

  // COMPLIANCE
  {id:'trs',cat:'compliance',color:'var(--brand)',title:'Trust Registration Service (TRS)',summary:'Most UK trusts must register, and keep the register up to date within 90 days.',
   body:'<p>The Trust Registration Service is HMRC\'s register of trusts. Most UK express trusts must register, whether or not they pay tax, unless they are excluded. Exclusions include registered charities, will trusts that only receive assets from the estate and are wound up within two years of the death, and pilot trusts set up before 6 October 2020 holding £100 or less.</p><p>New trusts must register within <strong>90 days</strong> of being set up or becoming liable to tax. Changes to trustees, beneficiaries or other details must then be updated within <strong>90 days</strong>. Taxable trusts must also confirm the register is up to date by <strong>31 January</strong> after each tax year with a tax liability.</p><p>Late registration can lead to penalties: £100 if up to three months late, £200 if three to six months late, and £300 or 5% of the tax (whichever is higher) if more than six months late.</p>',
   example:''},
  {id:'sa900',cat:'compliance',color:'var(--brand)',title:'SA900 Trust and Estate Tax Return',summary:'The annual tax return for trusts — due 31 October (paper) or 31 January (online).',
   body:'<p>SA900 is the annual Self Assessment tax return for trusts and estates. It covers all income received by the trust in the tax year (6 April to 5 April), and any capital gains from disposals during the year.</p><p>The deadlines are: <strong>31 October</strong> for paper returns, <strong>31 January</strong> for online filing. Any tax due must also be paid by 31 January. Late filing incurs an automatic £100 penalty, rising with further delay.</p><p>If the trust\'s tax bill for a year is over £1,000, HMRC may ask for <strong>payments on account</strong> towards the next year: half by 31 January and half by 31 July.</p><p>The SA900 may need supplementary pages, for example UK property (SA903), foreign income (SA904), capital gains (SA905) and non-residence (SA906). Trustees are responsible for filing even if they use an accountant — the accountability rests with the trustees.</p><p>Bare trusts do not file an SA900: the beneficiary reports the income. A trust whose income is within the £500 de minimis does not need to report it. If unsure, check with HMRC or a tax adviser.</p>',
   example:''},
  {id:'iht100',cat:'compliance',color:'var(--brand)',title:'IHT100 — Reporting chargeable events',summary:'File with HMRC within 6 months of a 10-year anniversary or exit charge.',
   body:'<p>Form IHT100 is the return trustees must submit to HMRC when a chargeable IHT event occurs in the trust. The main events are: a 10-year periodic charge, an exit charge on a capital distribution, or a change in the beneficial interests that triggers a charge.</p><p>The IHT100 must be submitted within <strong>6 months of the end of the month in which the chargeable event occurred</strong>. The tax due must also be paid by this deadline — late payment incurs interest.</p><p>A return may not be needed if the trust is an <strong>excepted settlement</strong>: for a 10-year charge, broadly where the value used in the calculation does not exceed <strong>80% of the nil-rate band</strong> (currently £260,000) and HMRC\'s other conditions are met (IHTM06123 onwards). If in doubt, ask your adviser or file.</p>',
   example:'<p>A trust had its 10-year anniversary on 15 March 2025. IHT100 must be filed and tax paid by <strong>30 September 2025</strong> (6 months from the end of March). If the hypothetical transfer was £220,000 (below 80% of £325,000 = £260,000), no return may be needed, provided the other conditions for an excepted settlement are met.</p>'},
  {id:'ta2000',cat:'compliance',color:'var(--brand)',title:'Trustee Act 2000 — Duty of care',summary:'Trustees must act with reasonable care and skill in all they do.',
   body:'<p>The Trustee Act 2000 introduced a statutory duty of care: trustees must exercise such care and skill as is reasonable in the circumstances, having regard to any special knowledge or experience they have (or hold themselves out as having). Professional trustees are held to a higher standard.</p><p>The duty of care applies to: exercising investment powers, acquiring land, appointing agents and nominees, reviewing those appointments, and insuring trust assets.</p><p>Practically, this means trustees should: take appropriate advice before making significant investment decisions; document the reasoning behind major decisions (the decision log in this app is designed for exactly this); review investments at reasonable intervals; and not simply do nothing with trust assets.</p>',
   example:''},
  {id:'sic',cat:'compliance',color:'var(--brand)',title:'Standard investment criteria',summary:'Trustees must consider suitability and diversification when investing.',
   body:'<p>Section 4 of the Trustee Act 2000 sets out the standard investment criteria that trustees must apply when exercising any investment power: (1) the suitability of the proposed investment to the trust, and (2) the need for diversification of trust investments in so far as is appropriate to the circumstances.</p><p>Trustees must also periodically <strong>review</strong> the trust\'s investments and consider whether they remain suitable. There is no fixed interval prescribed by law, but annual review is the accepted standard.</p><p>Before investing, trustees should take proper advice from a person qualified to give it (s.5 TA 2000) — unless the trustees reasonably conclude that advice is unnecessary given the circumstances. This means documenting why no advice was sought when that decision is made.</p>',
   example:''},
  {id:'delegation',cat:'compliance',color:'var(--brand)',title:'Delegation — Trustee Act 2000',summary:'Investment management can be delegated to a professional, but trustees remain responsible.',
   body:'<p>Trustees may delegate their asset management functions to an authorised agent under the Trustee Act 2000 (s.11–27). This typically means instructing a fund manager or financial adviser to manage the trust\'s investments on a discretionary basis.</p><p>Delegation must be in writing. Trustees must provide the agent with a <strong>policy statement</strong> setting out how they want the trust investments managed (objectives, risk appetite, restrictions). Trustees must then periodically review whether the arrangement and the agent\'s compliance with the policy statement remain appropriate.</p><p>Crucially: <strong>delegation does not remove liability</strong>. If trustees fail to review the agent\'s performance and the trust suffers loss, they can still be held personally liable. Keep records of every review.</p>',

// UK tax year: returns the year in which the tax year STARTS
// e.g. any date 6 Apr 2025–5 Apr 2026 returns 2025
function taxYearOf(dateStr){
  var dt=new Date(dateStr);
  var y=dt.getFullYear();
  return dt<new Date(y+'-04-06')?(y-1):y;
}

// ============================================================
// TRUST INCOME TAX  (checked October 2026)
// - Trust rate 45%, dividend trust rate 39.35% (unchanged for 2026/27).
// - The £1,000 standard rate band was ABOLISHED from 6 April 2024
//   (F(No.2)A 2023 Sch 2). It was replaced by a £500 DE MINIMIS: if the
//   trust's total income for the year is within the limit the trustees
//   have no liability; above it, ALL the income is taxed (a cliff edge,
//   not a band). The limit is divided by the number of trusts the settlor
//   made, minimum £100.
// - Interest in possession trustees: basic rate 20% on non-dividend income;
//   dividend ordinary rate 8.75% up to 2025/26, 10.75% from 6 April 2026.
// - Discretionary income payments are treated as paid net of 45% tax
//   (ITA 2007 s.494) whatever income funded them (HMRC TSEM3023, TSEM3756).
// ============================================================
var TRUST_RATE=0.45;
var DIV_TRUST_RATE=0.3935;
var BASIC_RATE=0.20;
var DE_MINIMIS=500;
function divOrdinaryRate(ty){return ty>=2026?0.1075:0.0875;}
function isIIPType(tt){return tt==='Interest in Possession'||tt==='Life Interest';}
// Other qualifying settlements (ITA 2007 s.24B(8)): the settlor's other discretionary trusts
// that are not settlor-interested and have trust-rate income this year. Falls back to the
// older "Settlor Total Trusts" field (minus this trust) for records saved before this question.
function otherQualifyingTrusts(trust){
  var v=trust.otherDiscTrusts;
  if(v!==undefined&&v!==null&&v!==''&&!isNaN(Number(v)))return Math.max(0,Math.floor(Number(v)));
  return Math.max(0,Math.floor(Number(trust.settlorTrusts)||1)-1);
}
// De minimis (s.24B): £500. Reduced only for a trust with trust-rate income whose settlor has
// other qualifying settlements: the higher of £100 and £500 / (others + 1). Interest in
// possession and settlor-interested trusts always keep £500.
function deMinimisLimit(trust,hasTrustRateIncome){
  var tt=trust.type||'Discretionary';
  if(isIIPType(tt)||trust.settlorInterested||hasTrustRateIncome===false)return DE_MINIMIS;
  var n=otherQualifyingTrusts(trust);
  if(n<=0)return DE_MINIMIS;
  return Math.max(100,DE_MINIMIS/(n+1));
}
// Trust management expenses: was the expense paid from income (allowable) or capital?
function expDefaultFunding(cat){if(cat==='Accountancy'||cat==='Bank Charges')return'income';if(cat==='Tax Payment')return'none';return'capital';}
function expenseFunding(e){return e.fundedFrom||expDefaultFunding(e.category);}
function expHint(cat){
  return{'Accountancy':'Usually income, for example preparing the trust\'s tax return. Work on the trust\'s capital (such as a property sale) is capital.',
    'Bank Charges':'Usually income, for the account that receives the trust\'s income.',
    'Legal Fees':'Usually capital: legal work for the whole trust is a capital expense.',
    'Insurance':'Usually capital: insuring the trust\'s assets benefits the whole trust.',
    'Valuation':'Usually capital.',
    'Tax Payment':'Tax is never an allowable expense. Record it for the accounts only.',
    'Property Maintenance':'If the property is let, take these costs off the rent when you record the rental income instead, so they are not counted twice.'}[cat]
    ||'Only expenses that relate directly to the trust\'s income count. If unsure, choose capital and ask your accountant.';
}
// ---- Income tax, checked line by line against the legislation (October 2026) ----
// Trust Manager calculates income tax from 2024-25, when the £500 rule began (Option A).
// Earlier years are covered by the trust's own returns; the tax pool and any unused expenses
// at 5 April 2024 are entered in the trust settings.
var TAX_FROM=2024;
function beforeTaxFrom(ty){return ty<TAX_FROM;}
// Rates by tax year. ITA 2007 ss.6-9; FA 2026 s.4 (dividend ordinary rate 10.75% from 2026-27);
// FA 2026 ss.5-7 and Sch 1 (from 2027-28: savings and property basic rate 22%, and the savings
// and property trust rates of 47% for discretionary trustees).
function taxRates(ty){
  var sp=ty>=2027;
  return{trustOther:TRUST_RATE,trustSav:sp?0.47:TRUST_RATE,trustProp:sp?0.47:TRUST_RATE,trustDiv:DIV_TRUST_RATE,
    basicOther:BASIC_RATE,basicSav:sp?0.22:BASIC_RATE,basicProp:sp?0.22:BASIC_RATE,divOrd:divOrdinaryRate(ty)};
}
// What the trust had at 5 April 2024 (only for trusts set up before 6 April 2024)
function openingFigures(trust){
  var old=!trust.established||trust.established<(TAX_FROM+'-04-06');
  return{needed:old,pool:old?(Number(trust.openingPool)||0):0,tme:old?(Number(trust.openingTME)||0):0,
    poolEntered:!old||(trust.openingPool!==undefined&&trust.openingPool!==null&&trust.openingPool!=='')};
}
// Income received by one trust in one tax year. Sale proceeds are capital. Income an interest in
// possession trust has mandated straight to the beneficiary is not the trustees' (SA950 Step 1(3)).
function trustYearIncome(trust,ty){
  var r={total:0,div:0,sav:0,prop:0,oth:0,other:0,mandated:0},iip=isIIPType(trust.type||'');
  S.income.forEach(function(i){
    if(i.trustId!==trust.id||i.type==='Sale Proceeds')return;
    if(taxYearOf(i.date)!==ty)return;
    var a=Number(i.amount)||0;
    if(i.mandated&&iip){r.mandated+=a;return;}
    r.total+=a;
    if(i.type==='Dividends')r.div+=a;else if(i.type==='Interest')r.sav+=a;else if(i.type==='Rental Income')r.prop+=a;else r.oth+=a;
  });
  r.other=r.sav+r.prop+r.oth;
  return r;
}
function tmeIncurred(trust,ty){
  var t=0;S.expenses.forEach(function(e){if(e.trustId===trust.id&&taxYearOf(e.date)===ty&&expenseFunding(e)==='income')t+=Number(e.amount)||0;});
  return t;
}
// One tax year of trustees' income tax.
// - £500 rule (s.24B): the test uses income before expenses; the reduced amount applies to a
//   discretionary trust with any trust rate income, which s.24B(5)(b) measures ignoring expenses.
// - In a £500 year net income is nil, so there is no trust rate income for expenses to be set
//   against: all of the year's expenses carry forward (s.485).
// - Otherwise expenses paid from income are grossed up and set against dividends, then savings,
//   then property (from 2027-28), then other income (s.486); that slice is taxed at the lower
//   rates instead of the trust rates (s.484(4)). Only trust-rate tax enters the pool (s.497).
function computeTaxYear(trust,ty,carryIn){
  var inc=trustYearIncome(trust,ty),tType=trust.type||'Discretionary',RT=taxRates(ty);
  var r={taxYear:ty,income:inc.total,divIncome:inc.div,otherIncome:inc.other,mandated:inc.mandated,limit:DE_MINIMIS,underDeMinimis:inc.total<=DE_MINIMIS,
    otherRate:0,divRate:0,otherTax:0,divTax:0,tax:0,poolTax:0,highTax:0,lowTax:0,taxWithoutTme:0,applies:true,beforeRules:false,rates:RT,
    tmeIncurred:0,tmeCarriedIn:carryIn||0,tmeUsed:0,tmeCarriedOut:carryIn||0,tmeGrossed:0,trustRateIncome:0};
  if(tType==='Bare'||tType==='Charitable'){r.applies=false;return r;}
  if(beforeTaxFrom(ty)){r.beforeRules=true;r.underDeMinimis=false;r.tmeCarriedIn=0;r.tmeCarriedOut=0;return r;}
  if(isIIPType(tType)){
    r.otherRate=RT.basicOther;r.divRate=RT.divOrd;r.tmeCarriedOut=0;
    if(r.underDeMinimis)return r;
    r.otherTax=inc.sav*RT.basicSav+inc.prop*RT.basicProp+inc.oth*RT.basicOther;r.divTax=inc.div*RT.divOrd;
    r.tax=r.otherTax+r.divTax;r.lowTax=r.tax;r.taxWithoutTme=r.tax;
    return r;
  }
  r.otherRate=RT.trustOther;r.divRate=RT.trustDiv;
  r.tmeIncurred=tmeIncurred(trust,ty);
  r.limit=deMinimisLimit(trust,inc.total>0.005);
  r.underDeMinimis=inc.total<=r.limit;
  if(r.underDeMinimis){r.tmeCarriedOut=r.tmeIncurred+r.tmeCarriedIn;return r;}
  var left=r.tmeIncurred+r.tmeCarriedIn;
  var buckets=[{amt:inc.div,low:RT.divOrd,high:RT.trustDiv,div:true},{amt:inc.sav,low:RT.basicSav,high:RT.trustSav},{amt:inc.prop,low:RT.basicProp,high:RT.trustProp},{amt:inc.oth,low:RT.basicOther,high:RT.trustOther}];
  buckets.forEach(function(bk){
    var cap=bk.amt*(1-bk.low),use=Math.min(left,cap);
    bk.g=use>=cap-1e-9?bk.amt:use/(1-bk.low);
    left-=use;r.tmeGrossed+=bk.g;
  });
  r.tmeUsed=r.tmeIncurred+r.tmeCarriedIn-left;r.tmeCarriedOut=left;
  r.trustRateIncome=Math.max(0,inc.total-r.tmeGrossed);
  buckets.forEach(function(bk){
    var lo=bk.g*bk.low,hi=(bk.amt-bk.g)*bk.high;
    r.lowTax+=lo;r.highTax+=hi;
    if(bk.div)r.divTax+=lo+hi;else r.otherTax+=lo+hi;
  });
  r.tax=r.lowTax+r.highTax;
  r.poolTax=trust.settlorInterested?0:r.highTax;
  r.taxWithoutTme=buckets.reduce(function(t2,bk){return t2+bk.amt*bk.high;},0);
  return r;
}
// All tax years in order, carrying unused expenses forward from 5 April 2024
function trustTaxYears(trust){
  var years={};
  S.income.forEach(function(i){if(i.trustId===trust.id&&i.type!=='Sale Proceeds'&&i.date)years[taxYearOf(i.date)]=true;});
  S.expenses.forEach(function(e){if(e.trustId===trust.id&&e.date&&expenseFunding(e)==='income')years[taxYearOf(e.date)]=true;});
  var out={},carry=openingFigures(trust).tme;
  Object.keys(years).map(Number).sort(function(a2,b2){return a2-b2}).forEach(function(ty){
    if(beforeTaxFrom(ty)){out[ty]=computeTaxYear(trust,ty,0);return;}
    var y=computeTaxYear(trust,ty,carry);out[ty]=y;carry=y.tmeCarriedOut;
  });
  return out;
}
function trustIncomeTax(trust,ty){
  var all=trustTaxYears(trust);
  if(all[ty])return all[ty];
  var carry=openingFigures(trust).tme;Object.keys(all).map(Number).sort(function(a2,b2){return a2-b2}).forEach(function(y){if(y<ty&&!beforeTaxFrom(y))carry=all[y].tmeCarriedOut;});
  return computeTaxYear(trust,ty,carry);
}
// ============================================================
// TAX POOL (ITA 2007 ss.496-498)
// In: tax charged at the trust rates only (nil in de minimis years; not the tax on income
// covered by expenses). Out: the 45% credit on every income distribution.
// Applies to discretionary / mixed / will trusts, not settlor-interested.
// ESTIMATE: verify with your accountant before a large distribution.
// ============================================================
function calcTaxPool(trust){
  if(!trust)return null;
  var tType=trust.type||'Discretionary';
  if(tType==='Bare'||isIIPType(tType)||tType==='Charitable')return null;
  if(trust.settlorInterested)return null;
  var all=trustTaxYears(trust),opening=openingFigures(trust).pool,poolIn=opening;
  Object.keys(all).forEach(function(y){poolIn+=all[y].poolTax;});
  var credits=distTaxById(trust);
  var curYear=taxYearOf(tdy());
  var poolOut=0,tyOut=0;
  S.distributions.forEach(function(d){
    if(d.trustId!==trust.id||!d.date||beforeTaxFrom(taxYearOf(d.date)))return;   // covered by the 5 April 2024 figure
    var c=(credits[d.id]&&credits[d.id].taxCredit)||0;
    poolOut+=c;if(taxYearOf(d.date)===curYear)tyOut+=c;
  });
  var tyIn=trustIncomeTax(trust,curYear).poolTax;
  return{poolIn:poolIn,opening:opening,poolOut:poolOut,balance:poolIn-poolOut,
    thisYear:{poolIn:tyIn,poolOut:tyOut,balance:tyIn-tyOut},curYear:curYear};
}

// How much pool remains after an additional credit of `creditAmt`
function poolAfterDist(trust,creditAmt){
  var pool=calcTaxPool(trust);
  if(!pool)return null;
  return pool.balance-creditAmt;
}

// Plain-English summary shown on the Distributions tab
function distInfoText(t){
  var tt=t.type||'Discretionary';
  if(tt==='Bare')return 'Trust is transparent. Beneficiary taxed at own rates.';
  if(tt==='Charitable')return 'Charitable trust: distributions carry no trust tax credit.';
  if(isIIPType(tt))return 'Trustees pay 20% on non-dividend income and the dividend ordinary rate on dividends (10.75% from 6 April 2026), unless the trust\'s total income for the year is within the £500 de minimis. The life tenant declares the gross income on their own return. Issue R185 (Boxes 3 to 5).';
  return 'Every income payment comes with a 45% tax credit for the beneficiary, which goes on their R185. The trust must already have paid enough tax to cover it, or the trustees pay the difference.';
}

// ---- Beneficiary tax-band history (trustee's recorded assessment, for the trust's records) ----
function benBandHistory(b){
  if(!b)return[];
  try{
    if(Array.isArray(b.bandHistory)&&b.bandHistory.length>0){
      return b.bandHistory.slice().sort(function(a,c){return new Date(a.effectiveFrom)-new Date(c.effectiveFrom)});
    }
    if(b.taxBand){
      return [{taxBand:b.taxBand,effectiveFrom:b.dob||'1900-01-01'}];
    }
  }catch(e){console.warn('benBandHistory error:',e);}
  return [];
}
function bandOnDate(b,dateStr){
  try{
    var hist=benBandHistory(b);
    if(hist.length===0)return null;
    var target=new Date(dateStr||tdy());
    var applicable=null;
    for(var i=0;i<hist.length;i++){
      if(new Date(hist[i].effectiveFrom)<=target)applicable=hist[i].taxBand;
    }
    return applicable!==null?applicable:hist[0].taxBand;
  }catch(e){console.warn('bandOnDate error:',e);return null;}
}
function currentBand(b){try{return bandOnDate(b,tdy());}catch(e){return null;}}
function valueStaleDays(trust){
  if(!trust)return null;
  if(!Number(trust.currentValue||0))return null;
  if(!trust.valueUpdatedAt)return null;
  return dbt(trust.valueUpdatedAt,tdy());

// TAX CALCULATIONS
// ============================================================
function calcDistTax(dist,trust){
  var amt=Number(dist.amount)||0,type=dist.distType||"Income - Non-Savings",tType=trust.type||"Discretionary";
  if(tType==="Bare")return{grossUp:amt,taxCredit:0,rate:0,note:"Bare trust: beneficiary taxed at own rates."};
  if(tType==="Charitable")return{grossUp:amt,taxCredit:0,rate:0,note:"Charitable trust: no trust tax credit."};
  if(type==="Capital")return{grossUp:amt,taxCredit:0,rate:0,note:"Capital distribution. May trigger exit charge."};

  if(trust.settlorInterested){
    return{grossUp:amt,taxCredit:0,rate:0,settlorInterested:true,
      note:"Settlor-interested trust: this income is taxed on the SETTLOR at their marginal rate, not at the trust rate. Report on the settlor's Self Assessment — do not issue a standard R185 tax credit."};
  }

  var ty=taxYearOf(dist.date||tdy());
  var yr=trustIncomeTax(trust,ty);

  // Interest in possession: the life tenant receives income net of the tax the
  // trustees actually paid on it. Credit = net x rate / (1 - rate).
  if(isIIPType(tType)){
    if(yr.underDeMinimis){
      return{grossUp:amt,taxCredit:0,rate:0,deMinimis:true,
        note:"Trust income for "+ty+"/"+(ty+1)+" is within the "+fm(yr.limit)+" de minimis, so the trustees pay no tax on it. The life tenant declares it as untaxed income."};
    }
    var r=(type==="Income - Dividends")?divOrdinaryRate(ty):BASIC_RATE;
    var g=amt/(1-r);
    return{grossUp:g,taxCredit:g-amt,rate:r,note:tType+": paid net of "+pct(r)+" tax paid by the trustees. Gross "+fm(g)+"."};
  }

  // Discretionary, Mixed, Will Trust: ITA 2007 s.494, always 45%.
  var gross=amt/(1-TRUST_RATE);
  return{grossUp:gross,taxCredit:gross-amt,rate:TRUST_RATE,deMinimisYear:yr.underDeMinimis,
    note:"Treated as paid with 45% tax already taken off, whatever income funded it. Gross "+fm(gross)+". Goes in Box 1 of the R185."};
}

// Single source of truth for per-distribution tax figures, used by the
// Distributions tab, Annual Account, R185, tax pool and pool warning.
function distTaxById(trust){
  var res={};if(!trust)return res;
  S.distributions.forEach(function(d){if(d.trustId===trust.id)res[d.id]=calcDistTax(d,trust);});
  return res;
}
// ============================================================
// CAPITAL GAINS TAX  (checked October 2026)
// Sources: TCGA 1992 ss.1-4 and Sch 1C; HMRC CG18030, CG18090, CG21500; GOV.UK "Trusts and
// Capital Gains Tax" and "Report and pay your Capital Gains Tax".
// - Trustees pay 24% on all gains. Annual exempt amount (AEA) £1,500 (half of £3,000), divided by
//   the settlor's qualifying settlements made after 6 June 1978, never below £300 (one-tenth of
//   £3,000). Trusts made before 7 June 1978 keep the full £1,500 (CG18090).
// - Each tax year separately. Losses of the year are set against gains in full, even if that
//   wastes the AEA; losses brought forward only bring gains down to the AEA (CG18030, CG21500).
// - Bare trusts: the gains are the beneficiary's. Charitable trusts: generally exempt.
// - Gains the trustee marks as held over (e.g. s.260) are not taxed on the trustees now.
// - UK residential property: report and pay within 60 days of completion if tax is due.
// ============================================================
var CGT_RATE=0.24,CGT_AEA_TRUST=1500,CGT_AEA_MIN=300;
function cgtApplies(trust){var tt=trust.type||'Discretionary';return !(tt==='Bare'||tt==='Charitable');}
function cgtAEA(trust){
  if(trust.established&&trust.established<'1978-06-07')return CGT_AEA_TRUST;
  var n=Math.max(1,Math.floor(Number(trust.settlorTrusts)||1));
  return Math.max(CGT_AEA_MIN,CGT_AEA_TRUST/n);
}
function cgtYear(trust,ty,bf,aea){
  var r={taxYear:ty,applies:cgtApplies(trust),gains:0,losses:0,heldOver:0,net:0,bfIn:bf||0,bfUsed:0,aea:aea,aeaUsed:0,
    taxable:0,tax:0,lossesCarriedOut:bf||0,items:[]};
  S.gains.forEach(function(g){
    if(g.trustId!==trust.id||!g.date||taxYearOf(g.date)!==ty)return;
    var a=Number(g.amount)||0;r.items.push(g);
    if(a>=0){if(g.heldOver)r.heldOver+=a;else r.gains+=a;}else r.losses+=-a;
  });
  if(!r.applies){r.lossesCarriedOut=0;return r;}
  var net=r.gains-r.losses;
  if(net<0){r.lossesCarriedOut=r.bfIn-net;return r;}            // this year's losses exceed gains: AEA wasted
  r.net=net;
  r.bfUsed=Math.min(r.bfIn,Math.max(0,net-aea));                  // only down to the AEA
  var after=net-r.bfUsed;
  r.lossesCarriedOut=r.bfIn-r.bfUsed;
  r.aeaUsed=Math.min(after,aea);
  r.taxable=Math.max(0,after-aea);
  r.tax=r.taxable*CGT_RATE;

}
// Every tax year with disposals, in order, carrying unused losses forward
function cgtYears(trust){
  var ys={};S.gains.forEach(function(g){if(g.trustId===trust.id&&g.date)ys[taxYearOf(g.date)]=true;});
  var out={},bf=0,aea=cgtAEA(trust);
  Object.keys(ys).map(Number).sort(function(a,b){return a-b}).forEach(function(ty){var y=cgtYear(trust,ty,bf,aea);out[ty]=y;bf=y.lossesCarriedOut;});

}
function calcCGTYear(trust,ty){
  var all=cgtYears(trust);if(all[ty])return all[ty];
  var bf=0;Object.keys(all).map(Number).sort(function(a,b){return a-b}).forEach(function(y){if(y<ty)bf=all[y].lossesCarriedOut;});

// Current tax year (name kept for the dashboard)
function calcCGT(trust){var r=calcCGTYear(trust,taxYearOf(tdy()));r.st=Math.max(1,Math.floor(Number(trust.settlorTrusts)||1));return r;}
// UK residential property: report and pay within 60 days of completion
function cgtPropertyDeadlines(trust){

    .map(function(g){var d=new Date(g.date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+60);return{gain:g,date:d.toISOString().slice(0,10)};});

// ============================================================
// INHERITANCE TAX: RELEVANT PROPERTY TRUSTS  (checked October 2026)
// Sources: IHTA 1984 ss.64-69 and 144; HMRC IHTM42085-42088, 42114, 42115,
// 42118, 42165, 35182.
// - Exit before the first ten-year anniversary (s.68, IHTM42114): the rate comes
//   from the value PUT IN (before reliefs), not what the trust is worth now.
// - Ten-year charge (s.66, IHTM42087): capital charged on leaving the trust in the
//   previous 10 years REDUCES the nil-rate band; it is not added to the value.
// - Exit after an anniversary (s.69, IHTM42115): a fraction of the rate CHARGED at
//   that anniversary, so later changes in value do not move it.
// - Complete calendar quarters; no charge in the first quarter after the start or
//   after an anniversary (s.65(4)). HMRC rounds each percentage to 3 decimals.
// - Will trusts: no exit charge within 2 years of the death (s.144, IHTM35182).
// - Nil-rate band £325,000, frozen to 5 April 2031.
// Where something can't be modelled, the app shows "at least"/"at most" only when

var LIFETIME_RATE=0.20;

function addMonthsD(d,m){
  var mo=d.getUTCMonth()+m,ny=d.getUTCFullYear()+Math.floor(mo/12),nm=((mo%12)+12)%12;
  var last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();

// Complete quarter years from the start date to the day before the event
function completeQuarters(startStr,eventStr){

  while(n<400&&addMonthsD(s,3*(n+1))<=e)n++;

}
function anniversaryDate(trust,i){return isoD(addMonthsD(parseD(trust.established),120*i));}
function lastAnniversaryIndex(trust,dateStr){var i=0;while(i<20&&anniversaryDate(trust,i+1)<=dateStr)i++;return i;}

// Is the trust inside the relevant property regime? true / false / null (unknown)
function rpApplies(trust){
  var tt=trust.type||'Discretionary',s=trust.rpStatus||'auto';
  if(tt==='Bare'||tt==='Charitable')return false;
  if(s==='yes')return true;
  if(s==='no-pre2006'||s==='no-ipdi')return false;
  if(s==='unsure')return null;
  if(tt==='Discretionary'||tt==='Mixed')return true;
  return null; // Interest in Possession, Life Interest, Will Trust: trustee must say
}
// Steps 2-3 of IHTM42114 / IHTM42087: the "initial rate" (never more than 6%)
function ihtInitialRate(notional,cumulative){
  var nrba=Math.max(0,NRB-Math.max(0,cumulative||0));
  if(!(notional>0)||notional<=nrba)return 0;
  if(nrba===0)return 0.06;

// Which way is the estimate wrong? kind: 'exit1' (before 1st anniversary), 'exit2', 'ten'
function ihtBound(trust,kind,basis){
  var lo=false,hi=false,none=false;
  if(trust.sameDayTrusts&&!(kind==='exit2'&&basis==='recorded'))lo=true; // extra trusts only push the rate up

  if(trust.addedProperty){if(kind==='ten')hi=true;else none=true;}         // direction unknown for exits

// Amounts on which exit charges were imposed in the 10 years before an anniversary (s.66(5)(b))
function exitChargedBefore(trust,tyaStr){
  var from=isoD(addMonthsD(parseD(tyaStr),-120)),tot=0;
  S.distributions.forEach(function(d){
    if(d.trustId!==trust.id||d.distType!=='Capital'||!d.date)return;
    if(!(d.date>=from&&d.date<tyaStr))return;
    var ex=calcExitCharge(trust,d.amount,d.date,d.ihtPaidBy,true);

function tenYearRateAt(trust,i){
